name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Require an annotated tag on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" \
            | grep -F "Firstchair ${GITHUB_REF_NAME#v}"
      - name: Check the tag against the package version
        id: tag
        run: |
          PYTHONPATH=src python -m firstchair.release_tag "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"

  test:
    name: Verify release candidate
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: [validate, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Smoke-test the distribution and record checksums
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          import venv
          from pathlib import Path

          wheel, = Path("dist").resolve().glob("*.whl")
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          environment = os.environ.copy()
          environment.pop("PYTHONPATH", None)

          with tempfile.TemporaryDirectory(prefix="firstchair-wheel-") as directory:
              workspace = Path(directory)
              install = workspace / "venv"
              venv.create(install, with_pip=True, symlinks=True)
              python = install / "bin" / "python"
              cli = install / "bin" / "firstchair"
              subprocess.run(
                  [python, "-m", "pip", "install", "--no-deps", wheel],
                  cwd=workspace, env=environment, check=True,
              )
              subprocess.run(
                  [python, "-m", "pip", "check"],
                  cwd=workspace, env=environment, check=True,
              )
              installed_version = subprocess.check_output(
                  [cli, "--version"], cwd=workspace, env=environment, text=True, timeout=10,
              ).strip()
              if installed_version != version:
                  raise SystemExit(f"Expected version {version}, found {installed_version}")

              task = "Verify the synthetic handoff"
              command = [cli, "--state-dir", workspace / "state"]
              run = json.loads(subprocess.check_output(
                  [*command, "run", "--provider", "synthetic", task],
                  cwd=workspace, env=environment, timeout=30,
              ))
              if (
                  run["status"] != "completed"
                  or run["stage"] != "synthesize"
                  or task not in run["result"]
                  or task not in run["worker_review"]["assignment"]
                  or run["usage"]["provenance"] != "unknown"
              ):
                  raise SystemExit("The installed wheel did not complete the synthetic handoff")
              saved = json.loads(subprocess.check_output(
                  [*command, "status", run["run_id"]],
                  cwd=workspace, env=environment, timeout=10,
              ))
              if saved != run:
                  raise SystemExit("The saved run record differed from the CLI result")
          PY
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          PYTHONPATH=src python -m firstchair.release_tag "$GITHUB_REF_NAME" \
            --notes release-notes.md
          flags=(
            --verify-tag
            --title "Firstchair ${GITHUB_REF_NAME#v}"
            --notes-file release-notes.md
          )
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS "${flags[@]}"
