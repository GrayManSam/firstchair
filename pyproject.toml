[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firstchair"
version = "0.1.0a1"
description = "Local-first orchestration for AI coding CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
firstchair = "firstchair.cli:main"
# Formerly TriadMux. Remove in the next minor release.
triadmux = "firstchair.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]
